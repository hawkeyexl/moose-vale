name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VALE_VERSION: "3.20.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vale
        run: |
          curl -sSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version

      - name: Build package
        run: zip -r Moose.zip Moose

      - name: Sync a consumer from the built zip
        run: |
          mkdir -p consumer
          cp fixtures/*.md consumer/
          printf 'StylesPath = styles\nMinAlertLevel = suggestion\nPackages = %s\n' "$PWD/Moose.zip" > consumer/.vale.ini
          cd consumer
          vale sync
          echo "--- installed styles"
          ls styles
          ls styles/.vale-config
          echo "--- effective config"
          vale ls-config

      - name: Only the vendored styles are installed
        working-directory: consumer
        run: |
          for s in Voices Direct Moose Std; do
            test -d "styles/$s" || { echo "missing style: $s"; exit 1; }
          done
          for s in Coach GenZ Simple; do
            test ! -d "styles/$s" || { echo "unexpected style: $s"; exit 1; }
          done
          vale ls-config | grep -q '"Voices"' || { echo "Voices not enabled"; exit 1; }
          vale ls-config | grep -q '"Direct"' || { echo "Direct not enabled"; exit 1; }
          vale ls-config | grep -q '"Moose"'  || { echo "Moose not enabled"; exit 1; }

      - name: bad.md trips every expected rule
        working-directory: consumer
        run: |
          vale --no-exit --output=JSON bad.md > bad.json
          cat bad.json
          for check in Direct.Hedging Direct.Preamble Direct.Length Moose.EmDash Voices.InflatedWords Voices.WeakVerbs Voices.BinaryContrast; do
            jq -e --arg c "$check" '[.[][] | select(.Check == $c)] | length > 0' bad.json > /dev/null \
              || { echo "expected alert missing: $check"; exit 1; }
          done

      - name: good.md is clean
        working-directory: consumer
        run: vale good.md

      - name: Auto-fixes keep their case and grammar
        working-directory: consumer
        run: |
          vale --no-exit --output=JSON bad.md > bad.json
          jq -e '[.[][] | select(.Check == "Voices.InflatedWords" and .Action.Params[0] == "Use")] | length > 0' bad.json > /dev/null \
            || { echo "InflatedWords fix lost its capital"; exit 1; }
          jq -e '[.[][] | select(.Check == "Voices.WeakVerbs" and .Action.Params[0] == "decide")] | length > 0' bad.json > /dev/null \
            || { echo "WeakVerbs fix is not decide"; exit 1; }

      - name: Std.Usage.GenderedTerms leaves the word "name" alone
        working-directory: consumer
        run: |
          mkdir -p std && printf 'StylesPath = ../styles
MinAlertLevel = suggestion
[*.md]
BasedOnStyles = Std
' > std/.vale.ini
          printf 'Set the file name and the parameter name.
' > std/name.md
          cd std && vale --no-exit --output=line name.md | tee out.txt
          ! grep -q 'GenderedTerms' out.txt || { echo "GenderedTerms still flags name"; exit 1; }

      - name: README passes its own voice
        run: |
          vale sync
          vale README.md
